<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvin Construction and Painting</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100%; overflow: hidden; }
        
        .background-fixed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("static/img/hero-bg.jpg") no-repeat center center !important;
            background-size: cover !important; background-position: center !important; z-index: -1;
        }

        section {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 10%; box-sizing: border-box; opacity: 0; visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        section.active { opacity: 1; visibility: visible; }

        /* --- BARRA DE NAVEGACIÓN --- */
        .top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 60px; box-sizing: border-box; z-index: 100; 
        }

        /* TRUCO DEL LOGO: Filtro para darle máxima intensidad y visibilidad */
        .logo-corner { 
            width: 150px; 
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)) saturate(1.4) contrast(1.2) brightness(1.1); 
            cursor: pointer; 
            transition: transform 0.3s ease;
        }
        .logo-corner:hover { transform: scale(1.05); }

        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; font-weight: 600; text-transform: uppercase; font-size: 0.85em; transition: color 0.3s; }
        .nav-links a:hover { color: #f3e5ab; }

        /* --- TARJETA DE CONTENIDO --- */
        .content-card {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); padding: 40px;
            border-radius: 15px; border-left: 6px solid #f3e5ab; max-width: 650px; width: 100%;
            color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .content-card h1 { font-size: 3rem; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; }
        .content-card p { font-size: 1.2rem; color: #ddd; line-height: 1.6; }

        /* --- BOTONES --- */
        .btn-gold {
            display: inline-block; background: #f3e5ab; color: #111; padding: 12px 30px;
            font-weight: bold; text-decoration: none; border-radius: 25px; text-transform: uppercase;
            font-size: 0.9em; transition: all 0.3s ease; margin-top: 15px; box-shadow: 0 4px 15px rgba(243,229,171,0.3);
        }
        .btn-gold:hover { background: white; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(253,253,253,0.4); }

        /* --- OPTIMIZACIÓN EXCLUSIVA PARA TELÉFONOS (RESPONSIVE) --- */
        @media (max-width: 768px) {
            body, html { overflow-y: auto; height: auto; }
            section { position: relative; height: auto; min-height: 100vh; padding: 100px 20px 40px 20px; justify-content: flex-start; }
            
            .top-bar { 
                padding: 15px 20px; 
                background: rgba(0, 0, 0, 0.9); 
                backdrop-filter: blur(8px);
                flex-direction: column;
                gap: 15px;
            }
            .logo-corner { width: 120px; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 12px; }
            .nav-links a { font-size: 0.75em; }

            .content-card { padding: 25px; border-left: 4px solid #f3e5ab; text-align: center; }
            .content-card h1 { font-size: 1.8rem; letter-spacing: 1px; }
            .content-card p { font-size: 1rem; }
            .btn-gold { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="background-fixed"></div>

    <header class="top-bar">
        <img src="static/img/logo.png" alt="Marvin Logo" class="logo-corner">
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#galleries">Galleries</a></li>
            <li><a href="#quote">Get a Quote</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>

    <section id="home" class="active">
        <div class="content-card">
            <h1>Marvin Construction</h1>
            <p>Expert Painting & Remodeling Services. High-quality finishes for your home or business, fully custom-made.</p>
            <a href="#quote" class="btn-gold">Free Estimate</a>
        </div>
    </section>

    </body>
</html>
